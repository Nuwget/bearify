<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bearify · nuwget songs</title>
<meta name="theme-color" content="#0a0716">
<meta name="description" content="bearify — o streaming exclusivo das songs do nuwget.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>

<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="boot" aria-hidden="true">
  <div class="boot-inner">
    <p class="boot-logo">bearify<span>nuwget songs</span></p>
    <canvas id="bootBear" width="96" height="64"></canvas>
    <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div id="routeBar" aria-hidden="true"></div>

<div class="app">
  <aside class="side" aria-label="navegação">
    <a class="brand" href="#/home"><canvas id="mascotBear" width="50" height="56" aria-hidden="true"></canvas><span class="brand-t">bearify<span>nuwget songs</span></span></a>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5h2.5V21h13V10.5H21z"/></svg> Início</a>
      <a href="#/search" data-r="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg> Buscar</a>
      <a href="#/library" data-r="library"><svg viewBox="0 0 24 24"><path d="M4 3h3v18H4zM10 3h3v18h-3zm5 2h3l3 16h-3z"/></svg> Sua Biblioteca</a>
    </nav>
    <div class="libs" id="sidePlaylists">
      <p class="lib-t">Playlists</p>
    </div>
    <div class="libs about-sec">
      <p class="lib-t">Sobre</p>
      <button class="pl" data-about>Quem é Nuwget?</button>
    </div>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>
</div>

<footer class="dock" id="dock" aria-label="player">
  <div class="now" id="miniNow">
    <canvas class="cover" id="coverCanvas" width="32" height="32" aria-hidden="true"></canvas>
    <div class="now-t">
      <p class="t" id="nowTitle">—</p>
      <p class="s" id="nowArtist">—</p>
    </div>
    <button class="iconbtn sm" id="btnFav" type="button" aria-label="favoritar" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 21C7 16.5 3 13 3 8.8 3 6 5.2 4 7.8 4c1.7 0 3.2.9 4.2 2.3C13 4.9 14.5 4 16.2 4 18.8 4 21 6 21 8.8c0 4.2-4 7.7-9 12.2z"/></svg>
    </button>
  </div>
  <div class="center">
    <div class="transport">
      <button class="tbtn" id="btnShuffle" type="button" aria-label="aleatório" aria-pressed="false" title="Aleatório">
        <svg viewBox="0 0 24 24"><path d="M4 5h3l8 7-8 7H4l8-7zm12 0h4v2h-4zm0 12h4v2h-4zm0-7h4v2h-4z"/></svg>
      </button>
      <button class="tbtn" id="btnPrev" type="button" aria-label="anterior" title="Anterior">
        <svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zm4 7 9-6v12z"/></svg>
      </button>
      <button class="play" id="btnPlay" type="button" aria-label="tocar" title="Tocar/pausar (Espaço)">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      </button>
      <button class="tbtn" id="btnNext" type="button" aria-label="próxima" title="Próxima">
        <svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM5 6l9 6-9 6z"/></svg>
      </button>
      <button class="tbtn" id="btnLoop" type="button" aria-label="repetir" aria-pressed="false" title="Repetir">
        <svg viewBox="0 0 24 24"><path d="M7 7h10l-3-3 1.5-1.5L21 8l-5.5 5.5L14 12l3-3H7v5H5V7zm10 10H7l3 3-1.5 1.5L3 16l5.5-5.5L10 12l-3 3h10v-5h2v7z"/></svg>
      </button>
    </div>
    <div class="seek-row">
      <span id="tCur" class="time">0:00</span>
      <div class="seek" id="seekWrap"><div class="seek-fill" id="seekFill"></div><div class="seek-head" id="seekHead"></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="posição da música"></div>
      <span id="tDur" class="time">0:00</span>
    </div>
  </div>
  <div class="vol-row">
    <button class="qbadge" id="btnQuality" type="button" title="Qualidade de áudio">HiFi</button>
    <button class="iconbtn" id="btnLyrics" type="button" aria-label="letra" title="Letra">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h10v2H4z"/></svg>
    </button>
    <button class="iconbtn" id="btnQueue" type="button" aria-label="fila" title="Fila">
      <svg viewBox="0 0 24 24"><path d="M4 5h12v2H4zm0 5h12v2H4zm0 5h8v2H4zM18 13l4 4-4 4v-3h-5v-2h5z"/></svg>
    </button>
    <button class="iconbtn" id="btnDevices" type="button" aria-label="dispositivos" title="Dispositivos">
      <svg viewBox="0 0 24 24"><path d="M4 7h16v9h-5v2h3v2H6v-2h3v-2H4zm6 9h4v-2h-4z"/></svg>
    </button>
    <button class="iconbtn" id="btnMute" type="button" aria-label="mudo" title="Mudo (M)">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3-2-2-1.4 1.4L14.5 13l-1.4 1.4L14.5 16l2-2 2 2 1.4-1.4-2-1.6 2-1.6z"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="100" value="85" aria-label="volume">
    <button class="iconbtn" id="btnExpand" type="button" aria-label="expandir" title="Expandir">
      <svg viewBox="0 0 24 24"><path d="M9 4H4v5h2V6h3zm11 0h-5v2h3v3h2zm-2 11h-3v3H4v-5h2v3h10v-3h2z" transform="scale(.9) translate(1.3 1.3)"/></svg>
    </button>
  </div>
</footer>

<div class="lamp-widget" aria-hidden="true"><canvas id="mascotLamp" width="20" height="38"></canvas></div>

<!-- mobile: camada própria (js/mobile.js + css/mobile.css). Desktop não vê nada daqui. -->
<div id="m" class="m">
  <header id="mHead" class="m-head"></header>
  <main id="mView" class="m-view" tabindex="-1"></main>

  <div id="mMini" class="m-mini" role="group" aria-label="player" inert>
    <button class="m-mini-main" id="mMiniOpen" type="button" aria-label="abrir player">
      <canvas class="cov m-mini-art" id="mMiniArt" data-i="0" width="32" height="32" aria-hidden="true"></canvas>
      <span class="m-mini-t"><b id="mMiniTitle">—</b><span id="mMiniArtist">—</span></span>
    </button>
    <button class="m-btn m-play" id="mMiniPlay" type="button" aria-label="tocar ou pausar">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
    </button>
    <button class="m-btn m-next" id="mMiniNext" type="button" aria-label="próxima"><svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM5 6l9 6-9 6z"/></svg></button>
    <span class="m-mini-bar" aria-hidden="true"><i id="mMiniFill"></i></span>
  </div>

  <section id="mNP" class="m-np" data-view="player" aria-label="tocando agora" inert>
    <div class="m-pane m-pane-player">
      <header class="m-np-top">
        <button class="m-btn m-ic" id="mNpClose" type="button" aria-label="fechar"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
        <p class="m-np-k">Tocando agora</p>
        <button class="m-btn m-ic" id="mNpMore" type="button" aria-label="mais opções"><svg viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
      </header>
      <div class="m-np-scroll">
        <div class="m-art"><canvas class="cov" id="mNpArt" data-i="0" width="32" height="32" aria-label="capa"></canvas></div>
        <div class="m-np-id">
          <div class="m-np-names">
            <p class="m-np-title" id="mNpTitle">—</p>
            <p class="m-np-artist" id="mNpArtist">—</p>
            <p class="m-np-album" id="mNpAlbum">—</p>
          </div>
          <button class="m-btn m-fav" id="mNpFav" type="button" aria-label="favoritar" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21C7 16.5 3 13 3 8.8 3 6 5.2 4 7.8 4c1.7 0 3.2.9 4.2 2.3C13 4.9 14.5 4 16.2 4 18.8 4 21 6 21 8.8c0 4.2-4 7.7-9 12.2z"/></svg></button>
        </div>
        <p class="m-np-q" id="mNpQuality"></p>
        <p class="m-np-state" id="mNpState" role="status"></p>
        <div class="m-time">
          <span id="mCur">0:00</span>
          <div class="m-seek"><span class="m-seek-track"><i id="mSeekFill"></i></span><input id="mSeek" type="range" min="0" max="1000" value="0" aria-label="posição da música"></div>
          <span id="mDur">0:00</span>
        </div>
        <div class="m-ctrls">
          <button class="m-btn m-side" id="mShuffle" type="button" aria-label="aleatório" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2z"/></svg></button>
          <button class="m-btn m-skip" id="mPrev" type="button" aria-label="anterior"><svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zm4 7 9-6v12z"/></svg></button>
          <button class="m-btn m-play m-play-xl" id="mPlay" type="button" aria-label="tocar ou pausar">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
          </button>
          <button class="m-btn m-skip" id="mNext" type="button" aria-label="próxima"><svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM5 6l9 6-9 6z"/></svg></button>
          <button class="m-btn m-side" id="mLoop" type="button" aria-label="repetir" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
        </div>
        <button class="m-lyrcard" id="mLyrOpen" type="button">
          <span class="m-k">Letra</span>
          <span class="m-lyrcard-line" id="mLyrPeek"></span>
          <span class="m-lyrcard-cta" id="mLyrCta">Expandir letra</span>
        </button>
      </div>
    </div>

    <div class="m-pane m-pane-lyrics">
      <header class="m-np-top">
        <button class="m-btn m-ic" id="mLyrClose" type="button" aria-label="voltar ao player"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
        <div class="m-np-k m-np-k2"><p>Letra</p><span id="mLyrTrack">—</span></div>
        <span class="m-ic-sp"></span>
      </header>
      <div class="m-lyr-scroll" id="mLyr"></div>
      <footer class="m-lyr-foot">
        <span class="m-lyr-bar" aria-hidden="true"><i id="mLyrFill"></i></span>
        <button class="m-btn m-skip" id="mLyrPrev" type="button" aria-label="anterior"><svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zm4 7 9-6v12z"/></svg></button>
        <button class="m-btn m-play" id="mLyrPlay" type="button" aria-label="tocar ou pausar">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
        <button class="m-btn m-skip" id="mLyrNext" type="button" aria-label="próxima"><svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM5 6l9 6-9 6z"/></svg></button>
      </footer>
    </div>
  </section>

  <div id="mSheet" class="m-sheet-wrap" inert>
    <div class="m-scrim" data-m-sheet-close></div>
    <div class="m-sheet" id="mSheetBody" role="dialog" aria-modal="true"></div>
  </div>
</div>

<section class="np" id="np" aria-label="tocando agora" hidden>
  <div class="np-bg" id="npBg"></div>
  <header class="np-top">
    <button class="iconbtn" id="npClose" type="button" aria-label="fechar">‹</button>
    <p class="np-k">Tocando agora</p>
    <button class="iconbtn" id="npMore" type="button" aria-label="mais opções">···</button>
  </header>
  <div class="np-body">
    <div class="np-artwrap"><canvas class="cov" id="npCover" data-i="0" width="32" height="32" aria-label="capa"></canvas></div>
    <div class="np-main">
      <div class="np-titlerow">
        <div class="np-names">
          <p class="np-t" id="npTitle">—</p>
          <p class="np-a" id="npArtist">—</p>
          <p class="np-al" id="npAlbum">—</p>
        </div>
        <button class="iconbtn big" id="npFav" type="button" aria-label="favoritar" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 21C7 16.5 3 13 3 8.8 3 6 5.2 4 7.8 4c1.7 0 3.2.9 4.2 2.3C13 4.9 14.5 4 16.2 4 18.8 4 21 6 21 8.8c0 4.2-4 7.7-9 12.2z"/></svg>
        </button>
      </div>
      <p class="np-q" id="npQuality">—</p>
      <p class="np-state" id="npState" aria-live="polite"></p>
      <div class="np-seekrow">
        <span class="time" id="npCur">0:00</span>
        <div class="seek" id="npSeekWrap"><div class="seek-fill" id="npSeekFill"></div><div class="seek-head" id="npSeekHead"></div><input id="npSeek" type="range" min="0" max="1000" value="0" aria-label="posição da música"></div>
        <span class="time" id="npDur">0:00</span>
      </div>
      <div class="np-controls">
        <button class="tbtn" id="npShuffle" type="button" aria-label="aleatório" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 5h3l8 7-8 7H4l8-7zm12 0h4v2h-4zm0 12h4v2h-4zm0-7h4v2h-4z"/></svg></button>
        <button class="tbtn big" id="npPrev" type="button" aria-label="anterior"><svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zm4 7 9-6v12z"/></svg></button>
        <button class="play xl" id="npPlay" type="button" aria-label="tocar ou pausar">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
        <button class="tbtn big" id="npNext" type="button" aria-label="próxima"><svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM5 6l9 6-9 6z"/></svg></button>
        <button class="tbtn" id="npLoop" type="button" aria-label="repetir" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 7h10l-3-3 1.5-1.5L21 8l-5.5 5.5L14 12l3-3H7v5H5V7zm10 10H7l3 3-1.5 1.5L3 16l5.5-5.5L10 12l-3 3h10v-5h2v7z"/></svg></button>
      </div>
      <div class="np-vol" id="npVolWrap"></div>
      <div class="np-tabs" role="tablist">
        <button class="on" data-tab="lyrics" role="tab">Letra</button>
        <button data-tab="queue" role="tab">Fila</button>
        <button data-tab="info" role="tab">Info</button>
      </div>
      <div class="np-panels">
        <div class="np-lyrics" id="npLyrics"></div>
        <div class="np-queue" id="npQueue" hidden></div>
        <div class="np-info" id="npInfo" hidden></div>
      </div>
    </div>
  </div>
</section>

<aside class="drawer" id="queueDrawer" aria-label="fila" hidden>
  <header><p>Na fila</p><button class="iconbtn" id="queueClose" type="button" aria-label="fechar fila">✕</button></header>
  <ol id="queueList"></ol>
</aside>

<div class="ctx" id="ctx" hidden></div>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="sabProbe" aria-hidden="true"></div>
